plugins {
    id 'java-library'
    id 'application'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest-core:1.3'
}

application {
    // ./gradlew :core:run → QAS 시나리오 네 개를 돌려 결과를 출력한다
    mainClass = 'com.studyroom.demo.QasDemo'
    applicationDefaultJvmArgs = ['-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8']
}

test {
    useJUnit()
    testLogging {
        events 'passed', 'failed'
    }
}
